# ============================================================
#  nginx.conf — server 块
#
#  两种用法:
#    A. 静态版（推荐）: 由 deploy/Dockerfile.static 自动使用，
#       或宿主机 cp 到 /etc/nginx/conf.d/ 后把 root 改成 out/ 的绝对路径
#    B. 反代 standalone 版: 用文件末尾注释掉的那段
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 换成你的域名

    root   /usr/share/nginx/html;         # 宿主机部署时改为 /var/www/farm-cooling
    index  index.html;

    charset utf-8;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Next.js 构建产物带内容哈希，可以长缓存 ----
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Service Worker 绝不能缓存 ----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 静态导出后 /about 对应 about.html 或 about/index.html ----
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

