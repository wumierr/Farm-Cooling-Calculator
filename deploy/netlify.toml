# ============================================================
#  netlify.toml — Netlify 部署配置
#
#  用法 A（连 Git，全自动）:
#    1. cp deploy/netlify.toml ./netlify.toml
#    2. app.netlify.com -> Add new site -> Import an existing project -> 选本仓库
#    3. 其余保持默认（配置由本文件提供）
#
#  用法 B（命令行直传）:
#    ./scripts/build-static.sh
#    npx netlify-cli deploy --dir=out --prod
# ============================================================

[build]
  command = "DEPLOY_TARGET=cloudflare npx next build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  DEPLOY_TARGET = "cloudflare"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
